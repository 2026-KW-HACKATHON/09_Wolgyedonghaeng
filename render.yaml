# Render Blueprint (무료 플랜). 값은 넣지 않는다: sync:false 항목은 Render 화면에서 직접 입력한다.
# 무료 플랜은 한동안 요청이 없으면 잠들어서 첫 요청이 느리다. 시연 전에 /health 를 한 번 불러 깨운다.
services:
  - type: web
    name: jipgyeol-server
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: TRUST_PROXY
        value: "true" # Render 프록시 뒤에서 X-Forwarded-For 첫 값을 IP로 쓴다
      - key: RATE_LIMIT_PER_MIN
        value: "60"
      - key: CORS_ORIGINS # 웹 배포 주소 (쉼표로 여러 개). 예: https://<이름>.vercel.app
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_VISION_MODEL
        sync: false
      - key: OPENROUTER_TEXT_MODEL
        sync: false
      - key: KAKAO_REST_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: JUSO_API_KEY
        sync: false
      - key: BLDG_API_KEY
        sync: false
      - key: APP_TOKEN_SECRET # 로그인 토큰 서명용. 길고 무작위인 문자열. 비우면 재시작할 때마다 로그인이 풀린다
        sync: false
