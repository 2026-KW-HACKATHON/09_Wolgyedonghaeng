<text x="820" y="80" font-size="14" fill="#1D221E" text-anchor="middle"></text>
<line x1="620" y1="210" x2="620" y2="226" stroke="#1D221E" stroke-width="2" marker-end="url(#ah)"/>
<line x1="620" y1="316" x2="620" y2="332" stroke="#1D221E" stroke-width="2" marker-end="url(#ah)"/>
<text x="40" y="452" font-size="16" font-weight="700" fill="#1D221E" text-anchor="start">데이터·계약 · 배포 · 품질</text>
<rect x="40" y="466" width="360" height="150" rx="14" fill="#ECE8DF"/>
<text x="220.0" y="505.0" font-size="17" font-weight="700" fill="#1D221E" text-anchor="middle">데이터와 계약</text>
<text x="220.0" y="533.0" font-size="14" fill="#1D221E" text-anchor="middle">programs-2026.json (지원사업 14개)</text>
<text x="220.0" y="554.0" font-size="14" fill="#1D221E" text-anchor="middle">problem-types.json (문제 유형 8개)</text>
