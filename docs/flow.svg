<text x="170.0" y="456" font-size="14">사진을 8가지 유형 중 하나로</text>
<text x="170.0" y="476" font-size="14">확신도 0.7 미만이면</text>
<text x="170.0" y="496" font-size="14">확인 단계를 거쳐요</text>
<rect x="330" y="400" width="310" height="110" rx="14" fill="#ECE8DF" stroke="#2E7544" stroke-width="3"/>
<text x="485.0" y="430" font-size="17" font-weight="700" fill="#2E7544">규칙 매칭</text>
<text x="485.0" y="456" font-size="14">자격은 규칙이 정해요</text>
<text x="485.0" y="476" font-size="14">소득·집 형태·지은 해·지역</text>
<text x="485.0" y="496" font-size="14">후보에 든 사업만 다음으로</text>
